name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CONAN_VERSION: 2.11.0

jobs:
  build-windows:
    name: "Build Windows x64"
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4.3.0
        with:
          cache: true
          cache-key-prefix: windows-qt-6.9.3-v1
          modules: qtimageformats
          version: 6.9.3
          arch: win64_msvc2022_64
          setup-python: false

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          key: sccache-build-windows-x64-6.9.3
          restore-keys: |
            sccache-build-windows-x64

      - name: Cache conan packages
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-conan-user-${{ hashFiles('**/conanfile.py') }}-QT6
          path: ~/.conan2/
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-conan-user-

      - name: Prepare release auth config
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        env:
          MRAB: ${{ secrets.MRAB }}
          PHGTK: ${{ secrets.PHGTK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($Env:MRAB)) {
            throw "Repository secret MRAB is required for release builds."
          }
          if ([string]::IsNullOrWhiteSpace($Env:PHGTK)) {
            throw "Repository secret PHGTK is required for release builds."
          }

          $secretBytes = [System.Text.Encoding]::UTF8.GetBytes($Env:MRAB.Trim())
          $keyA = Get-Random -Minimum 1 -Maximum 256
          $keyB = Get-Random -Minimum 1 -Maximum 256
          $keyC = Get-Random -Minimum 1 -Maximum 256
          $encodedSecret = [System.Collections.Generic.List[string]]::new()

          for ($i = 0; $i -lt $secretBytes.Length; $i++) {
            $mask = (($keyA + ($i * 31)) -bxor ($keyB + ($i * 17)) -bxor ($keyC + ($i * 13))) -band 0xff
            $encodedSecret.Add([string](($secretBytes[$i] -bxor $mask) -band 0xff))
          }

          $encodedSecretText = $encodedSecret -join ", "
          @"
          #pragma once

          #include <array>
          #include <cstddef>
          #include <cstdint>

          #define CHATTERINO_RELEASE_AUTH_BLOB_OBFUSCATED 1

          namespace chatterino::release_auth_blob {

          inline constexpr std::uint8_t KEY_A = $keyA;
          inline constexpr std::uint8_t KEY_B = $keyB;
          inline constexpr std::uint8_t KEY_C = $keyC;
          inline constexpr std::array<std::uint8_t, $($secretBytes.Length)> DATA = {
              $encodedSecretText
          };

          }  // namespace chatterino::release_auth_blob
          "@ | Set-Content -Path src/providers/youtube/YouTubeOAuthSecrets.local.hpp -Encoding ascii

          $posthogBytes = [System.Text.Encoding]::UTF8.GetBytes($Env:PHGTK.Trim())
          $posthogKeyA = Get-Random -Minimum 1 -Maximum 256
          $posthogKeyB = Get-Random -Minimum 1 -Maximum 256
          $posthogKeyC = Get-Random -Minimum 1 -Maximum 256
          $encodedPosthogToken = [System.Collections.Generic.List[string]]::new()

          for ($i = 0; $i -lt $posthogBytes.Length; $i++) {
            $mask = (($posthogKeyA + ($i * 31)) -bxor ($posthogKeyB + ($i * 17)) -bxor ($posthogKeyC + ($i * 13))) -band 0xff
            $encodedPosthogToken.Add([string](($posthogBytes[$i] -bxor $mask) -band 0xff))
          }

          $encodedPosthogTokenText = $encodedPosthogToken -join ", "
          @"
          #pragma once

          #include <array>
          #include <cstddef>
          #include <cstdint>

          #define MERGERINO_POSTHOG_PROJECT_TOKEN_OBFUSCATED 1

          namespace chatterino::posthog_token_blob {

          inline constexpr std::uint8_t KEY_A = $posthogKeyA;
          inline constexpr std::uint8_t KEY_B = $posthogKeyB;
          inline constexpr std::uint8_t KEY_C = $posthogKeyC;
          inline constexpr std::array<std::uint8_t, $($posthogBytes.Length)> DATA = {
              $encodedPosthogTokenText
          };

          }  // namespace chatterino::posthog_token_blob
          "@ | Set-Content -Path src/controllers/analytics/PostHogProjectToken.local.hpp -Encoding ascii

      - name: Install and setup Conan
        shell: bash
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan --version
          conan profile detect -f

      - name: Install dependencies
        shell: bash
        run: |
          mkdir build
          cd build
          conan install .. \
            -s build_type=Release \
            -c tools.cmake.cmaketoolchain:generator="Ninja" \
            -b missing \
            --output-folder=. \
            -o with_openssl3=True

      - name: Build
        shell: pwsh
        run: |
          cd build
          cmake `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" `
            -DUSE_PRECOMPILED_HEADERS=ON `
            -DCHATTERINO_LTO=OFF `
            -DFORCE_JSON_GENERATION=Off `
            -DCHATTERINO_SPELLCHECK=On `
            ..
          ninja

      - name: Package
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: build
        shell: pwsh
        run: |
          $packageDir = "Mergerino"
          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }
          windeployqt bin/mergerino.exe --release --no-compiler-runtime --no-translations --no-opengl-sw --dir $packageDir --force-openssl
          Copy-Item bin/mergerino.exe $packageDir/
          Get-ChildItem bin -Filter '*.dll' | Copy-Item -Destination $packageDir -Force
          Copy-Item bin/kick_onboarding $packageDir/kick_onboarding -Recurse -Force
          ..\.CI\deploy-crt.ps1 $packageDir
          if (Test-Path "Mergerino.zip") {
            Remove-Item "Mergerino.zip" -Force
          }
          7z a Mergerino.zip .\$packageDir\*

      - name: Upload artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: Mergerino.zip
          path: build/Mergerino.zip
